# Deploy LiveKit interview agent (Docker) to Azure Web App for Containers
# Uses Docker Hub (public image) — avoids GHCR auth issues with Azure Web App.
#
# Required GitHub secrets:
#   DOCKERHUB_USERNAME                — Docker Hub username
#   DOCKERHUB_TOKEN                   — Docker Hub access token (Read & Write)
#   AZURE_WEBAPP_PUBLISH_PROFILE_AGENT — Azure publish profile for agentic-hr-agent
#
# Required Azure app settings (one-time):
#   WEBSITES_PORT = 8080

name: Build and deploy agent to Azure Web App - agentic-hr-agent

on:
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/main_agentic-hr-agent.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: agentic-hr-agent
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-hr-agent

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image meta
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agentic-hr-agent:${{ steps.meta.outputs.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agentic-hr-agent:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_AGENT }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-hr-agent:${{ needs.build.outputs.sha }}
