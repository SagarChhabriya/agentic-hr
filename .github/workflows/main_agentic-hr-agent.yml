# Deploy LiveKit interview agent to Azure Container Instances (ACI)
# ACI is designed for long-running background containers (no HTTP server required).
#
# One-time setup: run this in Azure CLI to create the resource group if needed:
#   az group create --name agentic-hr-rg --location centralindia
#
# Required GitHub secrets:
#   AZURE_CREDENTIALS                 — service principal JSON (see below)
#   GHCR_PAT                          — GitHub PAT with read:packages scope
#
# To create AZURE_CREDENTIALS:
#   az ad sp create-for-rbac --name "github-aci-deploy" \
#     --role contributor \
#     --scopes /subscriptions/<sub-id>/resourceGroups/agentic-hr-rg \
#     --sdk-auth
# Copy the JSON output as the AZURE_CREDENTIALS secret.

name: Build and deploy agent to Azure Container Instances

on:
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/main_agentic-hr-agent.yml'
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/sagarchhabriya/agentic-hr-agent
  ACI_NAME: agentic-hr-agent
  RESOURCE_GROUP: agentic-hr
  LOCATION: centralindia

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image meta
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.GHCR_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances
        uses: azure/cli@v2
        with:
          inlineScript: |
            az container create \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.ACI_NAME }} \
              --image ${{ env.GHCR_IMAGE }}:${{ needs.build.outputs.sha }} \
              --registry-login-server ghcr.io \
              --registry-username sagarchhabriya \
              --registry-password "${{ secrets.GHCR_PAT }}" \
              --cpu 1 \
              --memory 2 \
              --restart-policy Always \
              --os-type Linux \
              --location ${{ env.LOCATION }} \
              --environment-variables \
                LIVEKIT_URL="${{ secrets.LIVEKIT_URL }}" \
                LIVEKIT_API_KEY="${{ secrets.LIVEKIT_API_KEY }}" \
                LIVEKIT_API_SECRET="${{ secrets.LIVEKIT_API_SECRET }}" \
                GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
                DEEPGRAM_API_KEY="${{ secrets.DEEPGRAM_API_KEY }}" \
                PYTHONUNBUFFERED=1
