# Deploy LiveKit interview agent (Docker) to Azure Web App for Containers
# Requires: Azure Web App "agentic-hr-agent" (Linux, Docker), publish profile secret, GHCR pull credentials on the Web App

name: Build and deploy agent to Azure Web App - agentic-hr-agent

on:
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/main_agentic-hr-agent.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: agentic-hr-agent
  REGISTRY_IMAGE: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_IMAGE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image meta
        id: meta
        run: |
          # echo "repo=$(echo '${{ github.repository_owner }}/agentic-hr-agent' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repo=sagarchhabriya/agentic-hr-agent" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY_IMAGE }}/${{ steps.meta.outputs.repo }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - name: Image meta
        id: meta
        run: |
          # echo "repo=$(echo '${{ github.repository_owner }}/agentic-hr-agent' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repo=sagarchhabriya/agentic-hr-agent" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Web App (container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_AGENT }}
          images: ${{ env.REGISTRY_IMAGE }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.sha }}
