# Deploy LiveKit interview agent (Docker) to Azure Web App for Containers
#
# Required GitHub secrets:
#   AZURE_WEBAPP_PUBLISH_PROFILE_AGENT — publish profile from Azure Portal
#
# Required Azure app settings (one-time setup):
#   DOCKER_REGISTRY_SERVER_URL      = https://ghcr.io
#   DOCKER_REGISTRY_SERVER_USERNAME = sagarchhabriya
#   DOCKER_REGISTRY_SERVER_PASSWORD = <GitHub PAT with read:packages, no expiry>
#   WEBSITES_PORT                   = 8080

name: Build and deploy agent to Azure Web App - agentic-hr-agent

on:
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/main_agentic-hr-agent.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: agentic-hr-agent
  GHCR_IMAGE: ghcr.io/sagarchhabriya/agentic-hr-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image meta
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.GHCR_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_AGENT }}
          images: ${{ env.GHCR_IMAGE }}:${{ needs.build.outputs.sha }}
