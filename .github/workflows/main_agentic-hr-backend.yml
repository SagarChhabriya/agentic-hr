# Deploy FastAPI backend to Azure Web App
# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy Python app to Azure Web App - agentic-hr-backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies from backend/requirements.txt
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Upload backend artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-backend
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_517BD4DDDE1F4C2F8E7E6CA7572D3FAA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_070A8291AB674181B272AF22946082B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_33B6C72E1036432F9F82E2E393FF2712 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'agentic-hr-backend'
          slot-name: 'Production'
          package: .
