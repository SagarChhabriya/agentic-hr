# Deploy FastAPI backend to Azure Web App
# Single-job workflow — no artifact upload needed.
# Azure Oryx installs dependencies from requirements.txt during deployment.

name: Build and deploy Python app to Azure Web App - agentic-hr-backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify requirements (no venv — Azure Oryx builds on the server)
        working-directory: ./backend
        run: pip install --dry-run -r requirements.txt --quiet

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_517BD4DDDE1F4C2F8E7E6CA7572D3FAA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_070A8291AB674181B272AF22946082B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_33B6C72E1036432F9F82E2E393FF2712 }}

      - name: Deploy source to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'agentic-hr-backend'
          slot-name: 'Production'
          package: ./backend
