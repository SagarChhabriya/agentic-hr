# Deploy React frontend to Vercel
# Vercel auto-deploys on push when connected via GitHub. This workflow runs checks.
# For deployment: connect repo at vercel.com and configure env vars.

name: Frontend CI and Deploy (Vercel)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://agentic-hr-backend.azurewebsites.net/api/v1' }}
